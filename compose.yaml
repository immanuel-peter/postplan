name: postplan

services:
  postgres:
    image: postgres:17-alpine
    container_name: postplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postplan
      POSTGRES_USER: postplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postplan-local-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postplan -d postplan"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: postplan-garage
    restart: unless-stopped
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-1111111111111111111111111111111111111111111111111111111111111111}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-postplan-local-dev-admin}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:-postplan-local-dev-metrics}
      GARAGE_DEFAULT_BUCKET: postplan
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-GKPOSTPLANLOCALDEV0000000}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:-postplan-local-dev-secret-key}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postplan-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      # Fastify host dispatch: set to `postplan.localhost` for local wildcard (`*.postplan.localhost` resolves to 127.0.0.1 on macOS via localhost subdomain)
      BASE_DOMAIN: ${BASE_DOMAIN:-postplan.localhost}
      DATABASE_URL: postgresql://postplan:${POSTGRES_PASSWORD:-postplan-local-dev}@postgres:5432/postplan
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: postplan
      S3_ADDRESSING_STYLE: path
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY:-GKPOSTPLANLOCALDEV0000000}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY:-postplan-local-dev-secret-key}
      TOKEN_PEPPER: ${TOKEN_PEPPER:-local-dev-pepper-do-not-use-in-prod}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-pp_local_dev_bootstrap}
      OPENAPI_PUBLIC: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: ["sh", "-c", "npm run db:migrate && node dist/server.js"]

volumes:
  postgres-data:
  garage-meta:
  garage-data:
