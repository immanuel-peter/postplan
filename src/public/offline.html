<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
    <title>Offline · Postplan</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5f2; color: #1a1a1a; font-family: "IBM Plex Sans", system-ui, sans-serif; }
      main { padding: 24px; text-align: center; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #6b6b6b; font-size: 14px; }
      button { font: inherit; font-size: 14px; padding: 8px 16px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
      @media (prefers-color-scheme: dark) {
        body { background: #161513; color: #ecebe6; }
        p { color: #a3a097; }
        button { background: #ecebe6; color: #161513; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Postplan needs a connection to load the dashboard.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
