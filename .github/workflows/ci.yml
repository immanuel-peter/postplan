name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postplan
          POSTGRES_PASSWORD: postplan
          POSTGRES_DB: postplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postplan -d postplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Each integration test file creates and drops its own database through this connection.
      TEST_DATABASE_URL: postgres://postplan:postplan@localhost:5432/postplan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
